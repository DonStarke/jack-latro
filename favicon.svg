<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="feltGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#09130f" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="100" fill="url(#feltGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="#2c3545" stroke-width="8"/>

  <!-- Playing Card Plate -->
  <rect x="96" y="64" width="320" height="384" rx="24" fill="#141820" stroke="#ffbe0b" stroke-width="10"/>

  <!-- Corner Jack & Spade -->
  <text x="124" y="132" font-family="'Courier New', monospace" font-size="58" font-weight="900" fill="#ffbe0b">J</text>
  <path d="M136,146 C136,146 122,164 122,176 C122,185 129,190 135,188 C135,188 134,196 130,200 L142,200 C138,196 137,188 137,188 C143,190 150,185 150,176 C150,164 136,146 136,146 Z" fill="#ff4b4b"/>

  <!-- Center Emblem (Chip with 21) -->
  <circle cx="256" cy="256" r="82" fill="#09130f" stroke="#009dff" stroke-width="8"/>
  <circle cx="256" cy="256" r="68" fill="none" stroke="#ff4b4b" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="256" y="280" font-family="'Courier New', monospace" font-size="70" font-weight="900" fill="#ffbe0b" text-anchor="middle" filter="url(#glow)">21</text>

  <!-- Bottom Corner Inverted Jack -->
  <g transform="rotate(180 380 390)">
    <text x="380" y="390" font-family="'Courier New', monospace" font-size="58" font-weight="900" fill="#ffbe0b">J</text>
  </g>
</svg>
